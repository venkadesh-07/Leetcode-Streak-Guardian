name: Daily Streak Reminder Check

on:
  schedule:
    # Runs every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    name: Check LeetCode Streaks & Send Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Streak Guardian Cron Endpoint
        run: |
          echo "Triggering automated streak reminder check on Render..."
          response=$(curl -s -S --max-time 120 --retry 2 --retry-delay 5 -X POST "https://leetcode-streak-guardian.onrender.com/api/cron/check-reminders?secret=${{ secrets.SECRET_KEY }}")
          echo "Server response: $response"
