name: Daily Streak Reminder Check

on:
  schedule:
    # Runs every 4 hours at :15 past the hour to match REMINDER_INTERVAL_SECONDS (4h) cooldown
    # Schedule: 00:15, 04:15, 08:15, 12:15, 16:15, 20:15 UTC (6 runs/day)
    - cron: '15 */4 * * *'
    # Emergency Auto-Rescue Run: 23:05 UTC (55 minutes before midnight UTC reset)
    - cron: '5 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force send alerts (bypass 4-hour anti-spam cooldown)'
        required: false
        type: boolean
        default: true


jobs:
  check-and-remind:
    name: Check LeetCode Streaks & Send Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Streak Guardian Reminder Job
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'production-streak-guardian-default-key-32b' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'venkadesh3948a@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: 'true'
          REMINDER_SENDER_EMAIL: ${{ secrets.REMINDER_SENDER_EMAIL || 'venkadesh3948a@gmail.com' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "======================================================="
          echo "Executing Streak Guardian Automated Reminder Check..."
          echo "======================================================="

          if [ -z "$DATABASE_URL" ]; then
            echo "❌ ERROR: DATABASE_URL secret is missing in GitHub Repository Secrets!"
            echo "GitHub Actions needs DATABASE_URL to connect to your database."
            echo "Go to Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: DATABASE_URL"
            exit 1
          else
            echo "✅ DATABASE_URL is configured."
          fi

          if [ -n "$BREVO_API_KEY" ]; then
            echo "✅ BREVO_API_KEY is configured (Emails will be sent via Brevo HTTPS API)."
          elif [ -n "$SMTP_PASSWORD" ]; then
            echo "✅ SMTP_PASSWORD is configured (Emails will be sent via SMTP)."
          else
            echo "⚠️ WARNING: Neither BREVO_API_KEY nor SMTP_PASSWORD is set in GitHub Secrets. Email alerts will run in simulation mode."
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "⚠️ WARNING: TELEGRAM_BOT_TOKEN secret is not set in GitHub Secrets. Telegram alerts will run in simulation mode."
          else
            echo "✅ TELEGRAM_BOT_TOKEN is configured."
          fi

          FORCE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" != "false" ]; then
            FORCE_ARG="--force"
            echo "⚡ Force mode active: Manual test run will bypass the 4-hour cooldown."
          fi

          python -m flask --app run:app check-reminders $FORCE_ARG


